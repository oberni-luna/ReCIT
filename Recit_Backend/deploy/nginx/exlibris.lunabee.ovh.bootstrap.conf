# Ex-libris backend (#93), before its certificate exists: port 80 only, so that
# `certbot certonly --nginx -d exlibris.lunabee.ovh` can answer the challenge. scripts/deploy-backend.sh --setup
# installs it once, then replaces it with exlibris.lunabee.ovh.conf.

server {
    listen 80;
    listen [::]:80;
    server_name exlibris.lunabee.ovh;

    location / {
        return 301 https://$host$request_uri;
    }
}
