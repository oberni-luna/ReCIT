# Ex-libris backend (#93), proxied to its Compose project on 127.0.0.1:8630.
# Installed by scripts/deploy-backend.sh --setup as /etc/nginx/sites-available/exlibris.lunabee.ovh, enabled as
# sites-enabled/zz-exlibris.lunabee.ovh: the `zz-` prefix keeps it from becoming the server's default site.
# The certificate is certbot's; the system timer renews it.

server {
    listen 80;
    listen [::]:80;
    server_name exlibris.lunabee.ovh;

    # Inside a location, not at server level: certbot's nginx authenticator adds its challenge location here
    # when it renews.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name exlibris.lunabee.ovh;

    ssl_certificate /etc/letsencrypt/live/exlibris.lunabee.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exlibris.lunabee.ovh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json;

    # Avatars and group photos are uploaded through here.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8630;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
