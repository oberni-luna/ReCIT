services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exlibris}
      POSTGRES_USER: ${POSTGRES_USER:-exlibris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exlibris}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  mail:
    image: axllent/mailpit
    environment:
      # Its reverse DNS lookup of a client outside Compose's network stalls every connection for ten seconds.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-exlibris}
      DATABASE_USER: ${POSTGRES_USER:-exlibris}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-exlibris}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SMTP_HOST: mail
      SMTP_PORT: 1025
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  db-data:
