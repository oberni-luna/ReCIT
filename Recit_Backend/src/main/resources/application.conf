ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [studio.lunabee.exlibris.backend.ApplicationKt.module]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/exlibris"
    url = ${?DATABASE_URL}
    user = "exlibris"
    user = ${?DATABASE_USER}
    password = "exlibris"
    password = ${?DATABASE_PASSWORD}
}

# The address the e-mails' links open. Its scheme decides the session cookies' `Secure` flag.
public {
    baseUrl = "http://localhost:8080"
    baseUrl = ${?PUBLIC_BASE_URL}
}

session {
    # Comma-separated, newest first: the first signs, every one verifies, so a secret can rotate.
    # This default only signs local sessions; the backend refuses it behind HTTPS.
    secrets = "local-development-only"
    secrets = ${?SESSION_SECRET}
}

# Mailpit, from `docker compose up mail`, unless told otherwise.
mail {
    host = "localhost"
    host = ${?SMTP_HOST}
    port = 1025
    port = ${?SMTP_PORT}
    user = ${?SMTP_USER}
    password = ${?SMTP_PASSWORD}
    startTls = false
    startTls = ${?SMTP_STARTTLS}
    from = "Ex-libris <no-reply@exlibris.localhost>"
    from = ${?MAIL_FROM}
}

# Avatars, filed by `LocalImageStore`. Relative to the working directory: `./gradlew run` files them in
# `Recit_Backend/data/images` (ignored by git), Compose in its `images` volume.
images {
    directory = "data/images"
    directory = ${?IMAGES_DIRECTORY}
}
