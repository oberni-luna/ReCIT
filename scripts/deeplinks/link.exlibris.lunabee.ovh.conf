# Ex-libris links: https://link.exlibris.lunabee.ovh/entity/<uri> opens the book or author in the app
# when it is installed (iOS universal link, Android App Link), and inventaire.io's page otherwise.
# Installed by scripts/deeplinks/deploy.sh as /etc/nginx/sites-available/link.exlibris.lunabee.ovh,
# enabled as sites-enabled/zz-link.exlibris.lunabee.ovh: the `zz-` prefix keeps it from becoming
# the server's default site. The certificate is certbot's; the system timer renews it.
#
# Link-preview robots (iMessage, WhatsApp, Slack…) get a page of their own on those paths instead,
# with the title and image of what the link names: the service in scripts/deeplinks/preview/, a
# Docker Compose project listening on 127.0.0.1:8620. nginx keeps its pages an hour, and lets one
# address ask for at most 10 a second (20 at once): past that, a robot gets the redirect too.

# This file is included in nginx's http block: the cache, the zone and the maps are global, hence
# their prefix.
proxy_cache_path /var/cache/nginx/exlibris-preview levels=1:2 keys_zone=exlibris_preview:10m
                 max_size=200m inactive=1d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=exlibris_preview_req:1m rate=10r/s;

# The path as the client sent it, still percent-encoded, without its query: the service reads
# nothing in a query, so a query must not make a new page, nor a new read of inventaire.io.
map $request_uri $exlibris_preview_path {
    "~^([^?]*)" $1;
}

map $http_user_agent $exlibris_preview_robot {
    default 0;
    "~*facebookexternalhit|whatsapp|slackbot|discordbot|telegrambot|twitterbot|linkedinbot|mastodon|bot|crawler|spider" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name link.exlibris.lunabee.ovh;

    # Inside a location, not at server level: certbot's nginx authenticator adds its challenge
    # location here when it renews.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name link.exlibris.lunabee.ovh;

    ssl_certificate /etc/letsencrypt/live/link.exlibris.lunabee.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.exlibris.lunabee.ovh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/link.exlibris.lunabee.ovh;

    # A robot's page the service fails to give falls back to the redirect: that second error
    # happens while the first one, the 418 that sends robots to the service, is being handled.
    recursive_error_pages on;

    # Apple and Google fetch these two as JSON, straight, without a redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    # The paths the apps open: a robot gets the preview page, everyone else inventaire.io's page.
    location ~ ^/(entity|items|lists|shelves|users|groups)/ {
        error_page 418 = @preview;
        if ($exlibris_preview_robot) {
            return 418;
        }
        return 302 https://inventaire.io$request_uri;
    }

    # The images the preview pages name, for whoever fetches them.
    location /og/ {
        proxy_pass http://127.0.0.1:8620;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
    }

    # Kept under the path the service reads — as sent, without the query — so that a query makes no
    # new page, and no spelling decoding to another link's path (`%2F`, `/../`) can stand in for its
    # page. Too many requests, or a service that fails, get the redirect.
    location @preview {
        limit_req zone=exlibris_preview_req burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8620$exlibris_preview_path;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_cache exlibris_preview;
        proxy_cache_key $exlibris_preview_path;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @inventaire;
    }

    location @inventaire {
        return 302 https://inventaire.io$request_uri;
    }

    # Everything else is a link opened without the app: the same path on inventaire.io.
    location / {
        return 302 https://inventaire.io$request_uri;
    }
}
