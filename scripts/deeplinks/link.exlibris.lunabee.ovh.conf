# Ex-libris links: https://link.exlibris.lunabee.ovh/entity/<uri> opens the book or author in the app
# when it is installed (iOS universal link, Android App Link), and inventaire.io's page otherwise.
# Installed by scripts/deeplinks/deploy.sh as /etc/nginx/sites-available/link.exlibris.lunabee.ovh,
# enabled as sites-enabled/zz-link.exlibris.lunabee.ovh: the `zz-` prefix keeps it from becoming
# the server's default site. The certificate is certbot's; the system timer renews it.

server {
    listen 80;
    listen [::]:80;
    server_name link.exlibris.lunabee.ovh;

    # Inside a location, not at server level: certbot's nginx authenticator adds its challenge
    # location here when it renews.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name link.exlibris.lunabee.ovh;

    ssl_certificate /etc/letsencrypt/live/link.exlibris.lunabee.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.exlibris.lunabee.ovh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/link.exlibris.lunabee.ovh;

    # Apple and Google fetch these two as JSON, straight, without a redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    # Everything else is a link opened without the app: the same path on inventaire.io.
    location / {
        return 302 https://inventaire.io$request_uri;
    }
}
